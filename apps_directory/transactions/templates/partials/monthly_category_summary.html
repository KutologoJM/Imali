{% load ui_tags %}


<div class="card bg-base-200 rounded-box p-4">
  <span class="text-2xs font-bold tracking-[0.12em] uppercase text-base-content/38 block mb-3">
    By Category
  </span>
    <div class="flex flex-col gap-3">
        {% for category in categories %}
            {% monthly_category_summary_card category %}
        {% endfor %}
        <div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-sm text-base-content/60">Housing</span>
                <span class="font-mono text-sm text-base-content/38">R14,000</span>
            </div>
            <div class="relative w-full h-1.5 bg-base-content/10 rounded-full overflow-hidden">
                <div class="absolute inset-y-0 left-0 w-full bg-error rounded-full"></div>
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-sm text-base-content/60">Food</span>
                <span class="font-mono text-sm text-base-content/38">R1,325</span>
            </div>
            <div class="relative w-full h-1.5 bg-base-content/10 rounded-full overflow-hidden">
                <div class="absolute inset-y-0 left-0 w-[9%] bg-warning rounded-full"></div>
            </div>
        </div>


    </div>
</div>
