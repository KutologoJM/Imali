{% load ui_tags %}
<div id="transactions_table" class="card bg-base-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="table table-zebra">
            <thead class="bg-base-300">
            <tr>
                <th class="w-12">
                    <label>
                        <input type="checkbox" class="checkbox checkbox-sm"/>
                    </label>
                </th>
                <th class="text-center">Transaction</th>
                <th class="text-center">Amount</th>
                <th class="text-center">Status</th>
                <th class="w-28"></th>
            </tr>
            </thead>
            <tbody>
            {% for transaction in transactions %}
                {% tx_table_field transaction %}
            {% empty %}
                <tr>
                    <td colspan="5" class="text-center py-8 text-base-content/50">
                        <i class="fa-solid fa-inbox text-3xl mb-2"></i>
                        <p>No transactions found</p>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    {% if transactions %}
    <div class="card-body py-3 border-t border-base-300">
        <div class="flex justify-between items-center text-sm text-base-content/60">
            <span>{{ transactions|length }} transaction{{ transactions|length|pluralize }}</span>
            <!-- Pagination placeholder -->
            <div class="join">
                <button class="join-item btn btn-xs btn-ghost" disabled>«</button>
                <button class="join-item btn btn-xs btn-ghost btn-active">1</button>
                <button class="join-item btn btn-xs btn-ghost" disabled>»</button>
            </div>
        </div>
    </div>
    {% endif %}
</div>
